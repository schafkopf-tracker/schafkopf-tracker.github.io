name: Wastl Engine Regressionstests

on:
  push:
    paths:
      - 'wastl-engine.js'
      - 'wastl-policy.js'
      - 'wastl-opponents.js'
      - 'wastl-match-analysis.js'
      - 'wastl-speech.js'
      - 'wastl-player-profile.js'
      - 'wastl-bot-brain.js'
      - 'wastl-bot-worker.js'
      - 'wastl-bots.js'
      - 'wastl-bots-ui.js'
      - 'wastl-montecarlo.js'
      - 'wastl-benchmark.js'
      - 'tests/**'
      - '.github/workflows/wastl-engine-tests.yml'
  pull_request:
    paths:
      - 'wastl-engine.js'
      - 'wastl-policy.js'
      - 'wastl-opponents.js'
      - 'wastl-match-analysis.js'
      - 'wastl-speech.js'
      - 'wastl-player-profile.js'
      - 'wastl-bot-brain.js'
      - 'wastl-bot-worker.js'
      - 'wastl-bots.js'
      - 'wastl-bots-ui.js'
      - 'wastl-montecarlo.js'
      - 'wastl-benchmark.js'
      - 'tests/**'
      - '.github/workflows/wastl-engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline-Tests ohne Fremdpakete
        run: node --test tests/wastl-montecarlo.test.js tests/wastl-opponents.test.js tests/wastl-quality.test.js tests/wastl-speech.test.js tests/wastl-player-profile.test.js tests/wastl-bot-brain.test.js
