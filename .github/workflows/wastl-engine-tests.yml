name: Wastl Engine Regressionstests

on:
  push:
    paths:
      - 'wastl-engine.js'
      - 'wastl-policy.js'
      - 'wastl-montecarlo.js'
      - 'wastl-benchmark.js'
      - 'tests/**'
      - '.github/workflows/wastl-engine-tests.yml'
  pull_request:
    paths:
      - 'wastl-engine.js'
      - 'wastl-policy.js'
      - 'wastl-montecarlo.js'
      - 'wastl-benchmark.js'
      - 'tests/**'
      - '.github/workflows/wastl-engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline-Tests ohne Fremdpakete
        run: node --test tests/wastl-montecarlo.test.js
